<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESAFE LA RIOJA - Estación 1</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
      linear-gradient(135deg, rgba(0, 123, 189, 0.85), rgba(0, 180, 236, 0.9)),
      url('Imagen2.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
      color: white;
    }

    /* BARRA SUPERIOR (Solo logo, el timer se quitó de aquí) */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-bar .logo-text {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, #d0f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .escape-container {
      width: 400px;
      max-width: 90%;
      padding: 35px 30px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 50, 100, 0.3);
      text-align: center;
      animation: entrada 0.8s ease-out;
    }

    /* ESTILO DEL RELOJ DENTRO DEL CONTENEDOR */
    .contenedor-timer {
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    @keyframes entrada {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-estacion h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .header-estacion p {
      color: #e0f4ff;
      font-size: 0.95rem;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .panel-teclado {
      width: 100%;
    }

    .pantalla-codigo {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      font-size: 2.5rem;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      letter-spacing: 10px;
      margin-bottom: 25px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .pantalla-codigo.error {
      color: #ff4a4a;
      border-color: #ff4a4a;
      text-shadow: 0 0 10px rgba(255, 74, 74, 0.5);
      background: rgba(239, 68, 68, 0.15);
    }

    .grid-teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .btn-num {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 18px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-num:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.25);
      color: #ffd6d6;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.4); }

    .btn-enter {
      background: rgba(16, 185, 129, 0.25);
      color: #d1fae5;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .btn-enter:hover { background: rgba(16, 185, 129, 0.4); }

    /* MODAL EMERGENTE PERSONALIZADO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 40, 70, 0.5);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      width: 400px;
      max-width: 90%;
      padding: 35px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 50px rgba(0, 50, 100, 0.4);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-icono {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }

    .modal-titulo {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-texto {
      color: #e0f4ff;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .modal-stats {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-stats p {
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-stats p:last-child { margin-bottom: 0; }
    .modal-stats span { font-weight: bold; color: #6ee7b7; }

    .modal-buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .modal-content.error-style .modal-titulo { color: #ffffff; }
    
    .btn-intentar { background: white; color: #007bbd; }
    .btn-intentar:hover { background: #f0f9ff; }

    .btn-consigna {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .btn-consigna:hover { background: rgba(255, 255, 255, 0.25); }

    .modal-content.success-style .modal-titulo { color: #ffffff; }
    .modal-content.success-style .btn-exito {
      background: white;
      color: #10b981;
    }
  </style>
</head>
<body>

  <audio id="musicaFondo" src="1.mp3" loop></audio>

  

  <div class="escape-container">
    <div class="contenedor-timer" id="timer">Tiempo: 00:00</div>

    <div class="header-estacion">
      <h1>🎛️ Consola de Desbloqueo</h1>
      <p>Ingresá el código numérico de 2 dígitos</p>
    </div>

    <div class="panel-teclado">
      <div class="pantalla-codigo" id="displayCodigo">--</div>

      <div class="grid-teclado">
        <button class="btn-num" onclick="presionarNumero(1)">1</button>
        <button class="btn-num" onclick="presionarNumero(2)">2</button>
        <button class="btn-num" onclick="presionarNumero(3)">3</button>
        <button class="btn-num" onclick="presionarNumero(4)">4</button>
        <button class="btn-num" onclick="presionarNumero(5)">5</button>
        <button class="btn-num" onclick="presionarNumero(6)">6</button>
        <button class="btn-num" onclick="presionarNumero(7)">7</button>
        <button class="btn-num" onclick="presionarNumero(8)">8</button>
        <button class="btn-num" onclick="presionarNumero(9)">9</button>
        <button class="btn-num btn-clear" onclick="borrarPantalla()">C</button>
        <button class="btn-num" onclick="presionarNumero(0)">0</button>
        <button class="btn-num btn-enter" onclick="validarCodigo()">✔</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalAlert">
    <div class="modal-content" id="modalCard">
      <div class="modal-icono" id="modalIcono">⚠️</div>
      <div class="modal-titulo" id="modalTitulo">Código Incorrecto</div>
      <div id="modalCuerpoDinamico">
         <div class="modal-texto" id="modalTexto">Las coordenadas introducidas no son válidas.</div>
      </div>
      <div class="modal-buttons-container" id="modalButtonsBox"></div>
    </div>
  </div>

  <script {box}>
    const CODIGO_CORRECTO = "11"; 
    let codigoIngresado = "";
    
    // Control de tiempo exacto usando el modelo de enunciado2.html
    let momentoEntrada = Date.now();
    let intervaloCronometro;
    let juegoTerminado = false;

    window.onload = function() {
      // --- LÓGICA DE AUDIO ---
      const audio = document.getElementById("musicaFondo");
      audio.volume = 0.6;
      
      const musicaActiva = localStorage.getItem("musicaActiva");
      const tiempoGuardado = localStorage.getItem("tiempoMusica");

      if (musicaActiva === "true") {
        if (tiempoGuardado) {
          audio.currentTime = parseFloat(tiempoGuardado);
        }
        audio.play().catch(err => console.log("Audio en espera", err));
      }

      setInterval(() => {
        localStorage.setItem("tiempoMusica", audio.currentTime);
      }, 100);

      // --- LÓGICA DEL TEMPORIZADOR ---
      actualizarCronometro();
      // Refresco constante cada 1 segundo
      intervaloCronometro = setInterval(actualizarCronometro, 1000);
    }

    // Calcula de forma precisa el tiempo transcurrido total
    function obtenerTiempoTotalTranscurrido() {
      const tiempoPasado = parseInt(localStorage.getItem("tiempoAcumulado")) || 0;
      const tiempoActual = Math.floor((Date.now() - momentoEntrada) / 1000);
      return tiempoPasado + tiempoActual;
    }

    function actualizarCronometro() {
      if (juegoTerminado) return; // Si ya ganó, detiene la actualización visual

      const transcurridoTotal = obtenerTiempoTotalTranscurrido();
      const minutos = Math.floor(transcurridoTotal / 60).toString().padStart(2, "0");
      const segundos = (transcurridoTotal % 60).toString().padStart(2, "0");

      document.getElementById("timer").innerText = "Tiempo: " + minutos + ":" + segundos;
    }

    function presionarNumero(num) {
      const display = document.getElementById("displayCodigo");
      display.classList.remove("error");

      if (codigoIngresado.length < 2) {
        codigoIngresado += num;
        display.innerText = codigoIngresado;
      }
    }

    function borrarPantalla() {
      codigoIngresado = "";
      document.getElementById("displayCodigo").innerText = "--";
      document.getElementById("displayCodigo").classList.remove("error");
    }

    function mostrarMensaje(tipo) {
      const overlay = document.getElementById("modalAlert");
      const card = document.getElementById("modalCard");
      const icono = document.getElementById("modalIcono");
      const titulo = document.getElementById("modalTitulo");
      const cuerpoDinamico = document.getElementById("modalCuerpoDinamico");
      const buttonsBox = document.getElementById("modalButtonsBox");

      card.classList.remove("error-style", "success-style");
      buttonsBox.innerHTML = ""; 

      if (tipo === "error") {
        card.classList.add("error-style");
        icono.innerText = "⚠️";
        titulo.innerText = "Error de Código";
        
        cuerpoDinamico.innerHTML = `<div class="modal-texto">El código ingresado es incorrecto. ¿Qué deseas hacer?</div>`;
        
        buttonsBox.innerHTML = `
          <button class="modal-btn btn-intentar" onclick="reintentarCodigo()">Volver a intentar</button>
          <button class="modal-btn btn-consigna" onclick="irAConsigna()">Volver a ver consigna</button>
        `;
      } else if (tipo === "exito") {
        juegoTerminado = true;
        clearInterval(intervaloCronometro);

        // Guardamos y acumulamos el tiempo final antes de congelar las variables
        const tiempoTotalAlGanar = obtenerTiempoTotalTranscurrido();
        localStorage.setItem("tiempoAcumulado", tiempoTotalAlGanar);

        card.classList.add("success-style");
        icono.innerText = "🔓";
        titulo.innerText = "¡Desbloqueado!";
        
        let puntajeFinal = localStorage.getItem("puntaje") || "1";
        
        // Convertimos el tiempo total acumulado para el modal
        const minModal = Math.floor(tiempoTotalAlGanar / 60).toString().padStart(2, "0");
        const segModal = (tiempoTotalAlGanar % 60).toString().padStart(2, "0");
        let tiempoFormateado = `${minModal}:${segModal}`;

        cuerpoDinamico.innerHTML = `
          <div class="modal-texto" style="margin-bottom: 15px;">
            Código de anulación correcto. El sistema se ha estabilizado con éxito.
          </div>
          <div class="modal-stats">
            <p>🎯 Puntaje Acumulado: <span>${puntajeFinal}</span></p>
            <p>⏱️ Tiempo Acumulado: <span>${tiempoFormateado}</span></p>
          </div>
        `;
        
        buttonsBox.innerHTML = `
          <button class="modal-btn btn-exito" onclick="continuarJuego()">Continuar</button>
        `;
      }

      overlay.classList.add("active");
    }

    function reintentarCodigo() {
      document.getElementById("modalAlert").classList.remove("active");
      borrarPantalla();
    }

    function irAConsigna() {
      // Antes de navegar, guardamos los segundos que transcurrieron en esta pantalla
      localStorage.setItem("tiempoAcumulado", obtenerTiempoTotalTranscurrido());
      window.location.href = "enunciado1.html";
    }

    function continuarJuego() {
      window.location.href = "indicaciones2.html";
    }

    function validarCodigo() {
      const display = document.getElementById("displayCodigo");

      if (codigoIngresado === CODIGO_CORRECTO) {
        let puntajeActual = parseInt(localStorage.getItem("puntaje") || "0");
        localStorage.setItem("puntaje", puntajeActual + 1);
        mostrarMensaje("exito"); 
      } else {
        display.classList.add("error");
        mostrarMensaje("error");
      }
    }
  </script>
</body>
</html>
