<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego 1 - Alimentación Saludable</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      min-height:100vh;
      background:
      linear-gradient(rgba(15,23,42,0.9), rgba(30,41,59,0.95)),
      url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1920&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:1100px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border-radius:30px;
      padding:40px;
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
      border:1px solid rgba(255,255,255,0.1);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      font-size:2.8rem;
      margin-bottom:10px;
    }

    .jugador{
      text-align:center;
      margin-bottom:15px;
      color:#cbd5e1;
      font-size:1.2rem;
    }

    .cronometro{
      text-align:center;
      font-size:1.4rem;
      margin-bottom:35px;
      color:#93c5fd;
      font-weight:bold;
    }

    .subtitulo{
      text-align:center;
      margin-bottom:35px;
      color:#dbeafe;
      font-size:1.1rem;
    }

    .bloque{
      background:rgba(255,255,255,0.08);
      border-radius:20px;
      padding:25px;
      margin-bottom:25px;
      border:1px solid rgba(255,255,255,0.1);
    }

    .bloque h2{
      margin-bottom:20px;
      color:#93c5fd;
      font-size:1.8rem;
    }

    .acciones{
      margin-top:35px;
      text-align:center;
    }

    button{
      padding:16px 45px;
      border:none;
      border-radius:15px;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:white;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 20px rgba(37,99,235,0.5);
    }

    button:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 25px rgba(37,99,235,0.7);
    }

    /* MODAL */
    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:1000;
    }

    .modal-contenido{
      width:90%;
      max-width:500px;
      background:#0f172a;
      padding:40px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
      animation:modalShow 0.5s ease;
    }

    @keyframes modalShow{
      from{
        transform:scale(0.8);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .modal h2{
      font-size:2rem;
      margin-bottom:20px;
      color:#93c5fd;
    }

    .modal p{
      font-size:1.2rem;
      margin-bottom:30px;
      line-height:1.7;
      color:#e2e8f0;
    }

    /* Contenedor principal en cuadrícula de 2 columnas */
    .opciones-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    /* Estilo de la tarjeta individual */
    .tarjeta-opcion {
      display: flex;
      align-items: flex-start;
      background-color: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 160px;
      box-sizing: border-box;
    }

    /* Efecto hover interactivo */
    .tarjeta-opcion:hover {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Contenedor interno para centrar imagen y texto verticalmente */
    .tarjeta-contenido {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Estilo de las imágenes */
    .img-opcion {
      width: 100%;
      max-width: 140px;
      height: 95px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* Estilo del texto debajo de la imagen */
    .texto-opcion {
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.3;
    }

    /* 1. Ocultar el input nativo (radio) pero mantenerlo funcional */
    .tarjeta-opcion input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    /* 2. Crear el nuevo indicador personalizado (círculo vacío para tipo radio) */
    .tarjeta-opcion::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; /* Forma circular para simular opción única */
      background-color: rgba(0, 0, 0, 0.2);
      margin-right: 12px;
      margin-top: 5px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      position: relative;
    }

    /* 3. Para pantallas chicas se adapta a una columna */
    @media(max-width:800px){
      .opciones-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 4. Efecto cuando pasás el mouse por encima de la tarjeta */
    .tarjeta-opcion:hover::before {
      border-color: rgba(255, 255, 255, 0.8);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* 5. Estilo cuando la opción está SELECCIONADA (Checked) */
    .tarjeta-opcion:has(input[type="radio"]:checked)::before {
      background-color: #3b82f6; /* Azul moderno */
      border-color: #3b82f6;
    }

    /* 6. Crear el tilde (✔) blanco adentro del círculo seleccionado */
    .tarjeta-opcion:has(input[type="radio"]:checked)::before {
      content: "✓";
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* 7. Agregar un borde sutil a toda la tarjeta cuando está seleccionada */
    .tarjeta-opcion:has(input[type="radio"]:checked) {
      border-color: rgba(59, 130, 246, 0.5);
      background-color: rgba(59, 130, 246, 0.05);
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Alimentación Saludable</h1>

    <div class="jugador" id="jugador"></div>

    <div class="cronometro" id="cronometro">
      Tiempo: 00:00
    </div>

    <div class="subtitulo">
      Selecciona una sola opción saludable en cada categoría.
    </div>

    <div class="bloque">
      <h2>🍽 Plato Principal</h2>
      <div class="opciones-grid">
        
        <label class="tarjeta-opcion">
          <input type="radio" name="plato" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/pic1.jpg" alt="Pechuga de pollo" class="img-opcion">
            <span class="texto-opcion">Pechuga de pollo/pescado/carne grillada o al horno</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="plato" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/pic2.jpg" alt="Tarta casera" class="img-opcion">

          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="plato" class="incorrecta">
          <div class="tarjeta-contenido">

            <span class="texto-opcion">Milanesa frita</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="plato" class="incorrecta">
          <div class="tarjeta-contenido">

            <span class="texto-opcion">Hamburguesa o sándwich jyq</span>
          </div>
        </label>
      </div>
    </div>

    <div class="bloque">
      <h2>🥗 Acompañamiento</h2>
      <div class="opciones-grid">
        
        <label class="tarjeta-opcion">

        <label class="tarjeta-opcion">

        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="acompanamiento" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/a3.jpg" alt="Papas fritas" class="img-opcion">
            <span class="texto-opcion">Papas fritas/noisette</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="acompanamiento" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/a4.jpg" alt="Puré instantáneo" class="img-opcion">
            <span class="texto-opcion">Puré instantáneo</span>
          </div>
        </label>
      </div>
    </div>

    <div class="bloque">
      <h2>🥤 Bebida</h2>
      <div class="opciones-grid">
        
        <label class="tarjeta-opcion">
          <input type="radio" name="bebida" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/b1.jpg" alt="Agua" class="img-opcion">
            <span class="texto-opcion">Agua/soda</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="bebida" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/b2.jpg" alt="Agua saborizada" class="img-opcion">
            <span class="texto-opcion">Agua saborizada sin azúcar</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="bebida" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/b3.jpg" alt="Gaseosa" class="img-opcion">
            <span class="texto-opcion">Gaseosa común</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="bebida" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/b4.jpg" alt="Bebida energizante" class="img-opcion">
            <span class="texto-opcion">Bebida energizante</span>
          </div>
        </label>
      </div>
    </div>

    <div class="bloque">
      <h2>🍎 Postre</h2>
      <div class="opciones-grid">
        
        <label class="tarjeta-opcion">
          <input type="radio" name="postre" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/p1.jpg" alt="Fruta fresca" class="img-opcion">
            <span class="texto-opcion">Fruta fresca</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="postre" class="correcta">
          <div class="tarjeta-contenido">
            <img src="img/p2.jpg" alt="Yogur natural" class="img-opcion">
            <span class="texto-opcion">Yogur natural</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="postre" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/p3.jpg" alt="Postrecito industrial" class="img-opcion">
            <span class="texto-opcion">Postrecito industrial</span>
          </div>
        </label>

        <label class="tarjeta-opcion">
          <input type="radio" name="postre" class="incorrecta">
          <div class="tarjeta-contenido">
            <img src="img/p4.jpg" alt="Alfajor" class="img-opcion">
            <span class="texto-opcion">Alfajor</span>
          </div>
        </label>
      </div>
    </div>

    <div class="acciones">
      <button onclick="evaluar()">
        ENVIAR RESPUESTAS
      </button>
    </div>

  </div>

  <div class="modal" id="modal">
    <div class="modal-contenido">
      <h2>Resultado</h2>
      <p id="mensaje"></p>
      <button onclick="continuar()">
        SIGUIENTE
      </button>
    </div>
  </div>

  <script>
    // MOSTRAR JUGADOR
    const nombre = localStorage.getItem("jugador");
    if(nombre){
      document.getElementById("jugador").innerHTML =
      "Jugador: <strong>" + nombre + "</strong>";
    }

    // INICIALIZAR PUNTAJE SI NO EXISTE
    if(localStorage.getItem("puntaje") === null){
      localStorage.setItem("puntaje", 0);
    }

    // EVALUAR RESPUESTAS
    function evaluar(){
      let puntos = 0;

      // SE EVALÚAN LOS ELEMENTOS SELECCIONADOS QUE SEAN CORRECTOS
      const correctas = document.querySelectorAll(".correcta");
      correctas.forEach(function(item){
        if(item.checked){
          puntos++;
        }
      });

      // EVITAR PUNTAJE NEGATIVO EN LA ACTIVIDAD ACTUAL
      if(puntos < 0){
        puntos = 0;
      }

      // OBTENER PUNTAJE ACUMULADO PREVIO
      let total = parseInt(localStorage.getItem("puntaje")) || 0;
      total += puntos;

      // GUARDAR EL NUEVO TOTAL ACUMULADO
      localStorage.setItem("puntaje", total);

      // MOSTRAR MODAL CON LOS RESULTADOS
      document.getElementById("modal").style.display = "flex";
      document.getElementById("mensaje").innerHTML =
      "Usted obtuvo <strong>" + puntos + "</strong> puntos en esta actividad.<br><br>" +
      "Puntaje acumulado: <strong>" + total + "</strong>";
    }

    // CONTINUAR A LA PÁGINA FINAL
    function continuar(){
      window.location.href = "indicaciones3.html";
    }

    // =========================
    // CRONOMETRO GLOBAL
    // =========================

      const inicio = localStorage.getItem("inicioTiempo");

      const minutos = Math.floor(transcurrido / 60).toString().padStart(2, "0");
      const segundos = (transcurrido % 60).toString().padStart(2, "0");

      document.getElementById("cronometro").innerHTML = "Tiempo: " + minutos + ":" + segundos;
    }

    actualizarCronometro();
    setInterval(actualizarCronometro, 1000);
  </script>

</body>
</html>
