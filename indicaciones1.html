<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial de la Salud - Indicaciones 1</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Mantenemos el fondo de la trivia con un toque sutil de alerta (rojo/azul en los extremos) */
      background:
        radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.15), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(37, 99, 235, 0.15), transparent 40%),
        linear-gradient(135deg, #0f172a, #111827);
      color: white;
      overflow: hidden;
    }

    .container {
      width: 550px;
      max-width: 92%;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: aparecer 0.8s ease-out;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .alerta-header {
      color: #38bdf8;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Estilo para destacar "Ataque Cardiosaludable" */
    h1 span {
      display: block;
      color: #3b82f6; /* Color azul representativo */
      font-size: 2.2rem;
      margin-top: 5px;
    }

    .caja-mision {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid #ef4444; /* Rojo de alerta médica */
      padding: 20px 25px;
      border-radius: 14px;
      text-align: left;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .objetivo-txt {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .narrativa {
      font-size: 1.15rem;
      color: #fca5a5; /* Tono rojo suave/alerta para lectura cómoda */
      font-weight: 600;
      line-height: 1.5;
    }

    .sub-info {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      /* Degradado del botón de acción */
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 5px 25px rgba(37, 99, 235, 0.4);
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 8px 30px rgba(37, 99, 235, 0.6);
    }

    button:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <audio id="musicaFondo" src="1.mp3" loop></audio>

  <div class="container">
    <div class="alerta-header">🚨 Transmisión de Misión</div>
    
    <h1>Primera Estación:<span>Ataque Cardiosaludable</span></h1>

    <div class="caja-mision">
      <div class="objetivo-txt">
        🎯 <strong>Objetivo:</strong> Identificar factores de riesgo / protectores.
      </div>
      <p class="narrativa">
        "Equipo técnico, tenemos una emergencia. El Capitán presenta una falla crítica en su sistema cardiovascular."
      </p>
    </div>

    <div class="sub-info">
      <div class="info-item">⏳ El tiempo corre...</div>
      <div class="info-item">❤️ El sistema cardíaco está en riesgo.</div>
    </div>

    <button onclick="irAEstacion()">
      ⚡ ¡ESTOY PREPARADO!
    </button>
  </div>

  <script>
    window.onload = function() {
      // Sincronización automática de la música
      const audio = document.getElementById("musicaFondo");
      audio.volume = 0.6;
      
      const musicaActiva = localStorage.getItem("musicaActiva");
      const tiempoGuardado = localStorage.getItem("tiempoMusica");

      if (musicaActiva === "true") {
        if (tiempoGuardado) {
          audio.currentTime = parseFloat(tiempoGuardado);
        }
        audio.play().catch(err => console.log("Audio esperando interacción del usuario", err));
      }

      // Registro continuo del tiempo en el almacenamiento local
      setInterval(() => {
        localStorage.setItem("tiempoMusica", audio.currentTime);
      }, 100);
    }

    function irAEstacion() {
      // Redirecciona directamente a la estación 1 donde está el teclado numérico
      window.location.href = "estacion1.html";
    }
  </script>

</body>
</html>
