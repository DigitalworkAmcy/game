<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESAFE LA RIOJA - Indicaciones 1</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
      linear-gradient(135deg, rgba(0, 123, 189, 0.85), rgba(0, 180, 236, 0.9)),
      url('Imagen2.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 20px 0; /* Evita que el contenedor pegue a los bordes superior/inferior en pantallas chicas */
    }

    .container {
      width: 580px; /* Un poco más ancho para albergar el título grande */
      max-width: 92%;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 50, 100, 0.3);
      text-align: center;
      animation: entrada 0.8s ease-out;
    }

    @keyframes entrada {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bienvenida-equipo {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e0f4ff;
      margin-bottom: 25px; /* Más espacio con el título principal */
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.08);
      display: inline-block;
      padding: 8px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .bienvenida-equipo span {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    /* Título unificado, más grande y llamativo */
    h1 {
      font-size: 2.4rem; 
      color: #ffffff;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Resaltado para la segunda parte del título */
    h1 span.destacado {
      display: block; /* Hace que baje de línea si es necesario y tenga más fuerza */
      font-size: 2.5rem;
      font-weight: 900;
      margin-top: 5px;
      background: linear-gradient(to right, #ffffff, #e0f4ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-indicaciones {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 30px;
      text-align: left;
    }

    .target-txt {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .narrativa {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0f4ff;
      font-style: italic;
    }

    .sub-info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 35px;
    }

    .info-item {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      color: #e0f4ff;
      font-weight: 500;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #007bbd;
      transition: 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.4);
      background: #f0f9ff;
    }

    /* ==========================================
       MEDIA QUERIES PARA RESPONSIVIDAD TOTAL
       ========================================== */
    @media (max-width: 600px) {
      .container {
        padding: 25px 20px; /* Reducimos márgenes internos en pantallas chicas */
      }

      h1 {
        font-size: 1.8rem; /* Título adaptado a móviles */
      }

      h1 span.destacado {
        font-size: 1.9rem;
      }

      .sub-info {
        flex-direction: column; /* Apila las tarjetas de información verticalmente */
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <audio id="musicaFondo" src="1.mp3" loop></audio>

  <div class="container">
    <div class="bienvenida-equipo" id="cartelBienvenida">
      Bienvenido Equipo: <span id="nombreEquipoDinamico">...</span>
    </div>
    
    <h1>
      ⏱️ Primer Tiempo:
      <span class="destacado">💔 Ataque Cardiosaludable</span>
    </h1>

    <div class="card-indicaciones">
      <div class="target-txt">
        🎯 <strong>Objetivo:</strong> Identificar factores de riesgo / protectores.
      </div>

      <p class="narrativa">
        "Equipo técnico, tenemos una emergencia. El Capitán presenta una falla crítica en su sistema cardiovascular."
      </p>
    </div>

    <div class="sub-info">
      <div class="info-item">⏳ El tiempo corre...</div>
      <div class="info-item">❤️ El sistema cardíaco está en riesgo.</div>
    </div>

    <button onclick="irAEstacion()">
      ⚡ ¡ESTOY PREPARADO!
    </button>
  </div>

  <script>
    window.onload = function() {
      const equipoGuardado = localStorage.getItem("equipoJugador");
      if (equipoGuardado) {
        document.getElementById("nombreEquipoDinamico").innerText = equipoGuardado;
      } else {
        document.getElementById("cartelBienvenida").innerText = "¡Bienvenidos al Desafío!";
      }

      const audio = document.getElementById("musicaFondo");
      audio.pause();
      audio.currentTime = 0;
      
      localStorage.setItem("musicaActiva", "false");
      localStorage.removeItem("tiempoMusica"); 
    }

    function irAEstacion() {
      window.location.href = "enunciado1.html";
    }
  </script>
</body>
</html>
