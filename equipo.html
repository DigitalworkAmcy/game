<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial de la Salud - Elige tu Equipo</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(135deg, rgba(15,23,42,0.85), rgba(30,41,59,0.9)),
      url('Imagen2.jpg');
      background-size:cover;
      background-position:center;
      overflow:hidden;
      color:white;
    }

    .container{
      width:450px;
      max-width:90%;
      padding:35px 40px 40px 40px;
      border-radius:28px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.15);
      box-shadow:0 10px 40px rgba(0,0,0,0.45);
      text-align:center;
      animation:entrada 1s ease;
    }

    @keyframes entrada{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:2rem;
      margin-bottom:10px;
      color:#ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .jugador-saludo{
      color:#93c5fd;
      font-size:1.1rem;
      margin-bottom:25px;
      font-weight: 600;
    }

    p{
      color:#dbeafe;
      margin-bottom:25px;
      font-size:1rem;
      line-height:1.5;
    }

    /* Contenedor de la selección de equipos */
    .equipos-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    /* Ocultar los inputs de radio reales */
    .radio-equipo {
      display: none;
    }

    /* Tarjetas de equipo customizadas */
    .tarjeta-equipo {
      padding: 20px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.3s ease;
      border: 2px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Estilo específico para el equipo Azul */
    .tarjeta-azul {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }
    .tarjeta-azul:hover {
      background: rgba(37, 99, 235, 0.4);
      border-color: #2563eb;
    }

    /* Estilo específico para el equipo Rojo */
    .tarjeta-rojo {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
    }
    .tarjeta-rojo:hover {
      background: rgba(220, 38, 38, 0.4);
      border-color: #dc2626;
    }

    /* Comportamiento cuando están seleccionados */
    .radio-equipo:checked + .tarjeta-azul {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      border-color: #93c5fd;
      color: white;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
    }

    .radio-equipo:checked + .tarjeta-rojo {
      background: linear-gradient(135deg, #b91c1c, #dc2626);
      border-color: #fca5a5;
      color: white;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }

    .icono-equipo {
      font-size: 2rem;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(135deg,#10b981,#059669); /* Color verde mundialista/estadio para el inicio */
      color:white;
      transition:0.3s;
      box-shadow:0 5px 20px rgba(16,185,129,0.4);
    }

    button:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 25px rgba(16,185,129,0.6);
    }

    .footer{
      margin-top:25px;
      font-size:0.9rem;
      color:#cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Selección de Equipo</h1>
    <div class="jugador-saludo" id="nombreSaludo"></div>

    <p>Elegí la camiseta de tu equipo para la competición corporativa:</p>

    <div class="equipos-container">
      <label>
        <input type="radio" name="equipo" value="Azul" class="radio-equipo" id="eqAzul">
        <div class="tarjeta-equipo tarjeta-azul">
          <span class="icono-equipo">🔵</span>
          <span>EQUIPO AZUL</span>
        </div>
      </label>

      <label>
        <input type="radio" name="equipo" value="Rojo" class="radio-equipo" id="eqRojo">
        <div class="tarjeta-equipo tarjeta-rojo">
          <span class="icono-equipo">🔴</span>
          <span>EQUIPO ROJO</span>
        </div>
      </label>
    </div>

    <button onclick="comenzarActividad()">
      ⚽ ¡COMENZAR TRIVIA!
    </button>

    <div class="footer">
      Mundial de la Salud © 2026
    </div>
  </div>

  <script>
    // Mostrar el nombre del jugador cargado desde el index
    window.onload = function() {
      const jugador = localStorage.getItem("jugador");
      if(jugador) {
        document.getElementById("nombreSaludo").innerText = "¡Hola, " + jugador + "!";
      } else {
        // Por resguardo, si entraron directo sin pasar por index
        window.location.href = "index.html";
      }
    }

    function comenzarActividad(){
      const opcionesEquipo = document.getElementsByName("equipo");
      let equipoSeleccionado = "";

      for(let i = 0; i < opcionesEquipo.length; i++){
        if(opcionesEquipo[i].checked){
          equipoSeleccionado = opcionesEquipo[i].value;
          break;
        }
      }

      // Validar selección de equipo
      if(equipoSeleccionado === ""){
        alert("Por favor, selecciona un equipo para representar.");
        return;
      }

      // Guardar el equipo elegido
      localStorage.setItem("equipoJugador", equipoSeleccionado);

      // Reiniciar puntajes de partidas previas
      localStorage.setItem("puntaje", 0);

      // DISPARAR EL CRONÓMETRO GLOBAL AQUÍ
      localStorage.setItem("inicioTiempo", Date.now());

      // Redirección estricta al requerimiento de la primera estación
      window.location.href = "estacion1.html";
    }
  </script>
</body>
</html>
