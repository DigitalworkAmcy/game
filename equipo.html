<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESAFE LA RIOJA - Elige tu Equipo</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      /* Fondo basado en el azul eléctrico vibrante, aplicando transparencia sobre la imagen base */
      background:
      linear-gradient(135deg, rgba(0, 123, 189, 0.85), rgba(0, 180, 236, 0.9)),
      url('Imagen2.jpg');
      background-size:cover;
      background-position:center;
      overflow:hidden;
      color:white;
    }

    .container{
      width:450px;
      max-width:90%;
      padding:35px 40px 40px 40px;
      border-radius:28px;
      /* Cristal de alta definición */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 50, 100, 0.3);
      text-align:center;
      animation:entrada 1s ease;
    }

    @keyframes entrada{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:2rem;
      margin-bottom:25px; /* Ajustado el margen al no estar el saludo */
      color:#ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p{
      color:#e0f4ff;
      margin-bottom:25px;
      font-size:1rem;
      line-height:1.5;
    }

    /* Contenedor del Input de Texto Moderno */
    .input-container {
      position: relative;
      margin-bottom: 35px;
      width: 100%;
    }

    .input-moderno {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      outline: none;
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Efecto de foco tecnológico al escribir */
    .input-moderno:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    /* Estilo del placeholder para que combine */
    .input-moderno::placeholder {
      color: rgba(224, 244, 255, 0.6);
      font-weight: 400;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      /* Botón blanco sólido que resalta con el fondo */
      background: white;
      color: #007bbd;
      transition: 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    button:hover{
      transform:translateY(-3px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.4);
      background: #f0f9ff;
    }

    .footer{
      margin-top:25px;
      font-size:0.9rem;
      color:#cbd5e1;
    }
  </style>
</head>
<body>

  <audio id="musicaFondo" src="1.mp3" loop></audio>

  <div class="container">
    <h1>Selección de Equipo</h1>

    <p>INGRESA EL NOMBRE DE TU EQUIPO:</p>

    <div class="input-container">
      <input type="text" id="nombreEquipo" class="input-moderno" placeholder="Ej: Los TECOTEAM" max-length="30" autocomplete="off">
    </div>

    <button onclick="comenzarActividad()">
      ⚽ ¡COMENZAR TRIVIA!
    </button>

    <div class="footer">
      BE-SAFE LA RIOJA © 2026
    </div>
  </div>

  <script>
    window.onload = function() {
      // 1. Manejo y Sincronización del Audio
      const audio = document.getElementById("musicaFondo");
      audio.volume = 0.6;
      
      const musicaActiva = localStorage.getItem("musicaActiva");
      const tiempoGuardado = localStorage.getItem("tiempoMusica");

      if (musicaActiva === "true") {
        if (tiempoGuardado) {
          audio.currentTime = parseFloat(tiempoGuardado);
        }
        audio.play().catch(err => console.log("Reinicio de audio pausado por interacción:", err));
      }

      setInterval(() => {
        localStorage.setItem("tiempoMusica", audio.currentTime);
      }, 100);
    }

    function comenzarActividad(){
      const equipoInput = document.getElementById("nombreEquipo").value.trim();

      // Validación para asegurarse de que escriban algo
      if(equipoInput === ""){
        alert("Por favor, ingresá un nombre para tu equipo antes de continuar.");
        return;
      }

      // Guardamos el nombre ingresado por el usuario
      localStorage.setItem("equipoJugador", equipoInput);
      localStorage.setItem("puntaje", 0);
      localStorage.setItem("inicioTiempo", Date.now());

      window.location.href = "indicaciones1.html";
    }
  </script>
</body>
</html>
