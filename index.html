<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESAFE LA RIOJA - Inicio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;

      /* Fondo basado en el azul eléctrico de tu imagen */
      background:
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15), transparent 50%),
        linear-gradient(135deg, #007bbd, #00b4ec);

      color: white;
    }

    .container{
      width:420px;
      max-width:90%;
      padding:35px 40px;
      border-radius:28px;
      /* Efecto cristal frosted moderno */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 50, 100, 0.3);
      text-align:center;
    }

    .logo-actividad {
      width: 140px;
      margin-bottom: 15px;
    }

    /* Animación bandera argentina para el título */
    h1{
      font-size: 2.2rem;
      margin-bottom: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      
      /* Creamos el degradado Celeste - Blanco - Celeste */
      background: linear-gradient(to right, #00b4ec, #ffffff, #00b4ec);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Animación fluida infinita */
      animation: ondearBandera 4s linear infinite;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
    }

    @keyframes ondearBandera {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    p{
      margin-bottom:30px;
      color: #e0f4ff; /* Blanco celeste muy suave */
      font-weight: 500;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      /* Botón blanco para contrastar con el fondo */
      background: white;
      color: #007bbd;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: 0.3s ease;
    }

    button:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.4);
      background: #f0f9ff;
    }
  </style>
</head>
<body>

  <audio id="musicaFondo" src="1.mp3" loop></audio>

  <div class="container">
    <img src="Imagen2.jpg" class="logo-actividad">

    <h1>BESAFE LA RIOJA</h1>

    <p>
      Poné a prueba tus conocimientos médicos en esta trivia interactiva.
    </p>

    <button onclick="iniciarJuego()">
      CONTINUAR
    </button>
  </div>

  <script>
    function iniciarJuego(){
      const audio = document.getElementById("musicaFondo");
      audio.volume = 0.6;

      audio.play().then(() => {
        localStorage.setItem("musicaActiva", "true");
      }).catch(() => {
        console.log("El navegador bloqueó el autoplay");
      });

      const interval = setInterval(() => {
        localStorage.setItem("tiempoMusica", audio.currentTime);
      }, 100);

      setTimeout(() => {
        clearInterval(interval);
        window.location.href = "equipo.html";
      }, 1500);
    }
  </script>

</body>
</html>
