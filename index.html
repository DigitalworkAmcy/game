<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial de la Salud - Inicio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;

      background:
        radial-gradient(circle at 20% 30%, rgba(37,99,235,0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(59,130,246,0.25), transparent 40%),
        linear-gradient(135deg, #0f172a, #1e293b);

      color:white;
    }

    .container{
      width:420px;
      max-width:90%;
      padding:35px 40px;
      border-radius:28px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.15);
      box-shadow:0 10px 40px rgba(0,0,0,0.45);
      text-align:center;
    }

    .logo-actividad {
      width: 140px;
      margin-bottom: 15px;
    }

    h1{
      font-size:2.2rem;
      margin-bottom:15px;
    }

    p{
      margin-bottom:30px;
      color:#dbeafe;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:white;
      transition:0.3s;
    }

    button:hover{
      transform:translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- AUDIO -->
  <audio id="musicaFondo" src="1.mp3" loop></audio>

  <div class="container">
    <img src="Imagen2.jpg" class="logo-actividad">

    <h1>Mundial de la Salud</h1>

    <p>
      Poné a prueba tus conocimientos médicos en esta trivia interactiva.
    </p>

    <button onclick="iniciarJuego()">
      CONTINUAR
    </button>
  </div>

  <script>
  function iniciarJuego(){
    const audio = document.getElementById("musicaFondo");
    audio.volume = 0.6;

    audio.play()
      .then(() => {
        // Redirige SOLO cuando el audio realmente empezó
        window.location.href = "equipo.html";
      })
      .catch(() => {
        // Si el navegador bloquea, igual avanza
        window.location.href = "equipo.html";
      });
  }
</script>

</body>
</html>
